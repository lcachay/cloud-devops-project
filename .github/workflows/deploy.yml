name: Deploy to EC2
# "pm2 start ecosystem.config.js --env ${{ env.ENVIRONMENT }}  --update-env",
#"pm2 save"
on:
  push:
    branches:
      - dev
      - prod

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
      INSTANCE_ID: ${{ github.ref_name == 'prod' && vars.PROD_INSTANCE_ID || vars.DEV_INSTANCE_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Set Build Info
        run: |
          echo "VERSION=${GITHUB_SHA}" >> .env
          echo "COMMIT_HASH=${GITHUB_SHA}" >> .env
          echo "BRANCH=${GITHUB_REF_NAME}" >> .env
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env
          echo "DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> .env

      - name: Build app
        run: npm run build

      - name: Prepare artifact
        run: |
          tar -czf app.tar.gz .next node_modules package.json public ecosystem.config.js .env --ignore-failed-read

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tar.gz

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp app.tar.gz s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.tar.gz

      - name: Deploy
        run: |
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters 'commands=[
            "LOCK_FILE=/tmp/deploy.lock",
            "if [ -f \"$LOCK_FILE\" ]; then echo \"Another deployment is running. Exiting.\"; exit 0; fi",
            "touch $LOCK_FILE",

            "echo \"CLEANUP\"",
            "export HOME=/root",
            "pm2 delete all || true",
            "pm2 kill || true",
            "pkill -9 -f PM2 || true",
            "pkill -9 -f node || true",
            "pkill -9 -f next-server || true",
            "pkill -9 -f \"npm start\" || true",
            "pkill -9 -f \"pm2 logs\" || true",
            "sleep 2",

            "echo \"VERIFY PORT FREE\"",
            "ss -ltnp | grep 3000 || true",
            "fuser -k 3000/tcp || true",
            "sleep 2",

            "export PM2_HOME=/root/.pm2",
            "chown -R root:root /opt/cloud-devops-project",

            "uptime",
            "cd /opt",
            "rm -rf cloud-devops-project",
            "mkdir cloud-devops-project",
            "cd cloud-devops-project",

            "echo \"Downloading artifact\"",
            "aws s3 cp s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.tar.gz app.tar.gz",

            "echo \"Extracting\"",
            "tar -xzf app.tar.gz",
            
            "echo \"Ecosystem file:\"",
            "test -f ecosystem.config.js || (echo \"Missing ecosystem file\" && exit 1)",

            "sleep 3",
            "pm2 startOrRestart ecosystem.config.js --env development --update-env --no-autorestart",

            "pm2 list || true",
            "pm2 status || true",
            "pm2 logs --lines 50 --nostream || true",

            "rm -f $LOCK_FILE"
            ]' \
            --region ${{ env.AWS_REGION }}
