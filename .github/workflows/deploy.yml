name: Deploy to EC2

on:
  push:
    branches:
      - dev
      - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ENVIRONMENT: ${{ github.ref_name == 'prod' && 'production' || 'development' }}
      INSTANCE_ID: ${{ github.ref_name == 'prod' && vars.PROD_INSTANCE_ID || vars.DEV_INSTANCE_ID }}
      S3_BUCKET: ${{ vars.S3_BUCKET }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install deps
        run: npm ci --no-audit --no-fund

      - name: Build app
        run: npm run build

      - name: Prepare artifact
        run: |
          tar -czf app.tar.gz .next node_modules package.json public --ignore-failed-read

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app
          path: app.tar.gz

      - name: Set Build Info
        run: |
          echo "VERSION=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "COMMIT_HASH=${GITHUB_SHA}" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF_NAME}" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV
          echo "DEPLOY_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload to S3
        run: |
          aws s3 cp app.tar.gz s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.tar.gz

      - name: Deploy
        run: |
          aws ssm send-command \
            --instance-ids $INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy from GitHub Actions" \
            --cloud-watch-output-config CloudWatchOutputEnabled=true \
            --parameters 'commands=[
            "set -e",
            "uptime",
            "cd /opt",
            "rm -rf cloud-devops-project",
            "mkdir cloud-devops-project",
            "cd cloud-devops-project",
            "aws s3 cp s3://${{ env.S3_BUCKET }}/app-${{ github.sha }}.tar.gz app.tar.gz",
            "tar -xzf app.tar.gz",
            "printf \"NODE_ENV=%s\nENVIRONMENT=%s\n\" \"${{ env.ENVIRONMENT }}\" \"${{ env.ENVIRONMENT }}\" > .env",
            "pm2 restart cloud-devops-project || pm2 start npm --name cloud-devops-project -- start -- -H 0.0.0.0"
            ]' \
            --region ${{ env.AWS_REGION }}
